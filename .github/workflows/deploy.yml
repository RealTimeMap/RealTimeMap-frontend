name: Test Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Размер шага версии. Пусто — посчитать по коммитам. Помни: пока версия 0.x, шаг сдвигается на разряд вниз, поэтому 0.1.0 из 0.0.x даёт major'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - patch
          - minor
          - major

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # changelogen сравнивает коммиты с последним тегом,
          # поэтому нужна полная история, а не срез в один коммит
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Bump Version from Commits
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Берём самый свежий тег по версии, а не ближайший по истории:
          # describe вернул бы предыдущий релиз, если поверх него лёг мердж.
          LAST_TAG=$(git tag --sort=-v:refname | head -1)
          PREV_VERSION="${LAST_TAG#v}"

          # changelogen считает следующую версию от той, что лежит в package.json,
          # а там намеренная заглушка 0.0.0 — без этой строки он выдал бы 0.0.1.
          # Файл всё равно не коммитим, правка живёт только внутри раннера.
          if [ -n "$PREV_VERSION" ]; then
            npm pkg set version="$PREV_VERSION"
          fi

          # при ручном запуске можно навязать размер шага
          BUMP_FLAG=""
          if [ -n "${{ inputs.bump }}" ]; then
            BUMP_FLAG="--${{ inputs.bump }}"
          fi

          bunx changelogen --bump $BUMP_FLAG

          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

          if [ "$VERSION" = "$PREV_VERSION" ]; then
            echo "Нечего релизить: версия осталась $VERSION"
            echo "CHANGED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "CHANGED=true" >> $GITHUB_OUTPUT

          # Строки «Release-note: ...» из тел коммитов — человеческое описание
          # для пользователей. Тег этой версии ещё не создан, поэтому
          # диапазон от предыдущего тега получается верным.
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          NOTES=$(git log "$RANGE" --format=%B | sed -n 's/^[Rr]elease-note:[[:space:]]*//p')

          # описание релиза = ручные заметки (если есть) + верхняя секция
          # свежесгенерированного CHANGELOG.md
          {
            if [ -n "$NOTES" ]; then
              echo "## Что нового"
              echo
              echo "$NOTES" | sed 's/^/- /'
              echo
            fi
            awk '/^## /{ n++ } n == 1' CHANGELOG.md
          } > release-notes.md

      - name: Commit Changelog and Tag
        if: steps.bump.outputs.CHANGED == 'true'
        run: |
          # package.json намеренно НЕ коммитим: версия живёт в теге.
          # Иначе main уходил бы вперёд по версии, а develop отставал.
          git checkout -- package.json
          git add CHANGELOG.md
          # [skip ci] обязателен: иначе пуш обратно в main запустит этот же workflow
          git commit -m "docs(changelog): v${{ steps.bump.outputs.APP_VERSION }} [skip ci]"
          git tag "v${{ steps.bump.outputs.APP_VERSION }}"
          git push origin main --follow-tags

      - name: Build Web Application
        if: steps.bump.outputs.CHANGED == 'true'
        env:
          APP_VERSION: ${{ steps.bump.outputs.APP_VERSION }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_YANDEX_GEOCODER_KEY: ${{ secrets.VITE_YANDEX_GEOCODER_KEY }}
          VITE_ORS_KEY: ${{ secrets.VITE_ORS_KEY }}
        run: bun run build

      - name: Sync Capacitor Android
        if: steps.bump.outputs.CHANGED == 'true'
        run: bunx cap sync android

      - name: Build Android Debug APK
        if: steps.bump.outputs.CHANGED == 'true'
        env:
          APP_VERSION: ${{ steps.bump.outputs.APP_VERSION }}
        run: |
          cd android && ./gradlew assembleDebug

      - name: Create GitHub Release
        if: steps.bump.outputs.CHANGED == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.bump.outputs.APP_VERSION }}
          name: Release v${{ steps.bump.outputs.APP_VERSION }}
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          bodyFile: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
