name: Test Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # changelogen сравнивает коммиты с последним тегом,
          # поэтому нужна полная история, а не срез в один коммит
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Bump Version from Commits
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PREV_VERSION=$(node -p "require('./package.json').version")

          # обновляет version в package.json и дописывает CHANGELOG.md
          bunx changelogen --bump

          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

          if [ "$VERSION" = "$PREV_VERSION" ]; then
            echo "Нечего релизить: версия осталась $VERSION"
            echo "CHANGED=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "CHANGED=true" >> $GITHUB_OUTPUT

          # описание релиза = верхняя секция свежесгенерированного CHANGELOG.md
          # (повторный вызов changelogen не знал бы о только что поднятой версии)
          awk '/^## /{ n++ } n == 1' CHANGELOG.md > release-notes.md

      - name: Commit Version and Changelog
        if: steps.bump.outputs.CHANGED == 'true'
        run: |
          git add package.json CHANGELOG.md
          # [skip ci] обязателен: иначе пуш обратно в main запустит этот же workflow
          git commit -m "chore(release): v${{ steps.bump.outputs.APP_VERSION }} [skip ci]"
          git tag "v${{ steps.bump.outputs.APP_VERSION }}"
          git push origin main --follow-tags

      - name: Build Web Application
        if: steps.bump.outputs.CHANGED == 'true'
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_YANDEX_GEOCODER_KEY: ${{ secrets.VITE_YANDEX_GEOCODER_KEY }}
        run: bun run build

      - name: Sync Capacitor Android
        if: steps.bump.outputs.CHANGED == 'true'
        run: bunx cap sync android

      - name: Build Android Debug APK
        if: steps.bump.outputs.CHANGED == 'true'
        run: |
          cd android && ./gradlew assembleDebug

      - name: Create GitHub Release
        if: steps.bump.outputs.CHANGED == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.bump.outputs.APP_VERSION }}
          name: Release v${{ steps.bump.outputs.APP_VERSION }}
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          bodyFile: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
