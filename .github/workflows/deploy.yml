name: Test Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Application
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_YANDEX_GEOCODER_KEY: ${{ secrets.VITE_YANDEX_GEOCODER_KEY }}
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android && ./gradlew assembleDebug

      - name: Extract Version from package.json
        id: read_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.read_version.outputs.APP_VERSION }}
          name: Release v${{ steps.read_version.outputs.APP_VERSION }}
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          body: Что-то точно могло сломаться!
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
